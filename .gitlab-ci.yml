# CI автотестов LMS: сборка образа и прогоны по стендам.
# Образ — на базе mcr.microsoft.com/playwright/python (Chromium внутри), см. Dockerfile.
# Секреты стендов (логины, пароли, токены) — в переменных CI/CD проекта (Settings → CI/CD → Variables,
# masked+protected), имена совпадают с .env.example. В репозиторий .env не попадает.

stages:
  - dockerize
  - test

variables:
  IMAGE: "${CI_REGISTRY_IMAGE}:latest"

docker:build:
  stage: dockerize
  tags:
    - devspark-builder
  when: manual
  variables:
    GIT_STRATEGY: clone
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
  script:
    - docker build --pull -t "${IMAGE}" -f Dockerfile .
    - docker push "${IMAGE}"

# Общая часть прогона: результаты и Allure-отчёт складываются в results/<env>/ и сохраняются как артефакт.
.run_tests:
  stage: test
  tags:
    - devspark-builder
  # Раннер devspark-builder — shell executor (job идёт на хосте, `image:` игнорируется),
  # поэтому тесты запускаем внутри собранного образа через docker run.
  # Переменные стендов — файл CI_TEST_ENV_FILE (тип File) в формате KEY=VALUE без кавычек.
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker pull "${IMAGE}"
  script:
    - mkdir -p "${CI_PROJECT_DIR}/results"
    - >
      docker run --rm --shm-size=1g
      --env-file "${CI_TEST_ENV_FILE}" -e HEADLESS=1
      -v "${CI_PROJECT_DIR}/results:/tests/results"
      "${IMAGE}" bash scripts/run.sh --env "${STAND}" ${PYTEST_ARGS}
  artifacts:
    when: always   # результаты нужны и при упавших тестах
    expire_in: 1 days
    paths:
      - results/
    reports:
      junit: results/**/junit.xml

# develop: полный прогон, разбит на API и UI, чтобы каждая джоба укладывалась в таймаут проекта (1 ч)
# и шла параллельно. Обе — по расписанию (Schedules) или вручную.
tests:develop:api:
  extends: .run_tests
  timeout: 2h
  variables:
    STAND: "develop"
    PYTEST_ARGS: "tests/api"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual

tests:develop:ui:
  extends: .run_tests
  timeout: 2h
  variables:
    STAND: "develop"
    PYTEST_ARGS: "tests/ui tests/e2e"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual

# stage: только вручную, по решению владельца автотестов (там БУК/LPD и e2e, данные общие с командой).
tests:stage:
  extends: .run_tests
  timeout: 2h
  variables:
    STAND: "stage"
    PYTEST_ARGS: ""
  rules:
    - when: manual

# prod: только smoke, полный прогон заблокирован в самих тестах (ensure_prod_allowed).
tests:prod-smoke:
  extends: .run_tests
  variables:
    STAND: "prod"
    PYTEST_ARGS: "-m smoke"
  rules:
    - when: manual
