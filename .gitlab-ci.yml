# CI автотестов LMS: сборка образа и прогоны по стендам.
# Образ — на базе mcr.microsoft.com/playwright/python (Chromium внутри), см. Dockerfile.
# Секреты стендов (логины, пароли, токены) — в переменных CI/CD проекта (Settings → CI/CD → Variables,
# masked+protected), имена совпадают с .env.example. В репозиторий .env не попадает.

stages:
  - dockerize
  - test

variables:
  IMAGE: "${CI_REGISTRY_IMAGE}:latest"

docker:build:
  stage: dockerize
  tags:
    - devspark-builder
  when: manual
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
  script:
    - docker build --pull -t "${IMAGE}" -f Dockerfile .
    - docker push "${IMAGE}"

# Общая часть прогона: результаты и Allure-отчёт складываются в results/<env>/ и сохраняются как артефакт.
.run_tests:
  stage: test
  # entrypoint образа — scripts/run.sh; GitLab должен запускать в контейнере shell, поэтому entrypoint сбрасываем
  image:
    name: "${IMAGE}"
    entrypoint: [""]
  tags:
    - devspark-builder
  variables:
    HEADLESS: "1"
  script:
    - cd /tests && scripts/run.sh --env "${STAND}" ${PYTEST_ARGS} && cp -r results "${CI_PROJECT_DIR}/" || { cp -r /tests/results "${CI_PROJECT_DIR}/" 2>/dev/null; exit 1; }
  artifacts:
    when: always   # результаты нужны и при упавших тестах
    expire_in: 1 days
    paths:
      - results/
    reports:
      junit: results/**/junit.xml

# develop: полный прогон, вручную или по расписанию (Schedules).
tests:develop:
  extends: .run_tests
  variables:
    STAND: "develop"
    PYTEST_ARGS: ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual

# stage: только вручную, по решению владельца автотестов (там БУК/LPD и e2e, данные общие с командой).
tests:stage:
  extends: .run_tests
  variables:
    STAND: "stage"
    PYTEST_ARGS: ""
  rules:
    - when: manual

# prod: только smoke, полный прогон заблокирован в самих тестах (ensure_prod_allowed).
tests:prod-smoke:
  extends: .run_tests
  variables:
    STAND: "prod"
    PYTEST_ARGS: "-m smoke"
  rules:
    - when: manual
