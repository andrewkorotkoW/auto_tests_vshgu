[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
markers =
    api: API tests
    ui: UI tests
    smoke: Smoke tests
    regression: Regression tests
    develop: Develop tests
    stage: Stage tests
    env(name): пометить тест как специфичный для окружения name — develop|stage
    practical_tasks: Практические задания (создание, прохождение, проверка)
    groups: Группы потока и групповые практические задания
    onboarding: Онбординг (первичный/повторный)
    knowledge_base: База знаний (достижения, статьи)
    test_constructor: Конструктор тестов и опросов (админка)
    dashboards: Дашборды статистики программ и курсов (админка)
    statistics: Карточка статистики курса (карта, фильтр, таблица, выгрузка)
    reviewer: Сценарии роли «Проверяющий»
    notifications: Уведомления (/api/v1/notifications/*) — списки, создание, шаблоны, register-/review-templates
    dictionaries: Справочники (/api/v1/dictionaries/*) — CRUD, связь с программами/пользователями
    tools: Юнит-тесты вспомогательных инструментов (test_data_generation/lib.py и т.п.), без сети и без --env
    mts_link: Интеграция с МТС Линк (tests/api/mts_link, tests/ui/mts_link) — каркас, skip без MTS_LINK_READY
    p2p: Взаимопроверка практических заданий (p2p) — пропускаются без P2P_READY (см. tests/api/p2p, tests/ui/p2p)
    mobile: Мобильная вёрстка портала (Pixel 7, --mobile/MOBILE=1) — тесты, проверенные на develop по факту прогона с --mobile, не «на глаз»
    ai_chat: Чат с ИИ в курсах (tests/api/ai_chat, tests/ui/ai_chat) — --env develop

