[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
markers =
    api: API tests
    ui: UI tests
    smoke: Smoke tests
    regression: Regression tests
    develop: Develop tests
    stage: Stage tests

