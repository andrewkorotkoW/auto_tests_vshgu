# Карта продукта ВШГУ для страницы «Покрытие» (схема продукта) в test_hub.
# Формат — app/core/product_map.py::parse_layout() (репозиторий test_hub):
# zones/nodes/edges/canvas; node.tests — префиксы nodeid/путей тестов этого репозитория.
#
# Раскладка (zones/nodes/edges, x/y/w/h) взята из
# test_hub/docs/missions/redesign/coverage_v5/product_map.json — утверждённого макета
# схемы продукта v5. node.tests сопоставлены по node.feature == feature.name с
# test_hub/docs/missions/redesign/coverage_v5/features_vshgu.yml (не v4 — этот файл
# в своей шапке прямо указывает, что сделан для карты продукта v5 и его имена функций
# 1:1 совпадают с node.feature). Префиксы тестов сверены с реальным деревом tests/ этого
# репозитория (только чтение) — все существуют.
